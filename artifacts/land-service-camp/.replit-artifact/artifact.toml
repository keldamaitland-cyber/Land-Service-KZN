kind = "web"
previewPath = "/"
title = "Land Service KZN National Camp 2026"
version = "1.0.0"
id = "artifacts/land-service-camp"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24062

[services.development]
run = "pnpm --filter @workspace/land-service-camp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/land-service-camp", "run", "build" ]
publicDir = "artifacts/land-service-camp/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24062"
BASE_PATH = "/"
